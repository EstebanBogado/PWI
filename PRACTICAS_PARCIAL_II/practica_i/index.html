<!DOCTYPE html>
<html lang="en">

<head>

<body>

        <section>

                <h3 class="color-universidad">Universidad</h3>
            </article>
            <article class="article-derecho">
                <div>
                    <label for="universidad">Ingrese una Universidad</label>
                    <select name="universidad" id="universidad">
                        <option value="" disabled selected hidden>Seleccione Universidad</option>
                        <option value="UNLaM">UNLaM</option>
                        <option value="UAI">UAI</option>
                        <option value="UNSaM">UNSaM</option>
                    </select>
                </div>
                <div>
                    <label for="color-fondo">Seleccione el color del fondo</label>
                    <select name="color-fondo" id="color-fondo">
                        <option value="" disabled selected hidden>Seleccione color del fondo</option>
                        <option value="red">ROJO</option>
                        <option value="green">VERDE</option>
                        <option value="blue">AZUL</option>
                    </select>
                </div>
                <div>
                    <label for="">Seleccione el color del texto</label>
                    <div class="div-color-texto">
                        <label><input type="radio" name="color" value="blanco"> Blanco</label>
                        <label><input type="radio" name="color" value="gris"> Gris</label>
                        <label><input type="radio" name="color" value="amarillo"> Amarillo</label>
                    </div>
            </article>
