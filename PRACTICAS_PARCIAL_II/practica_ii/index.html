<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="index.css">
    <title>práctica ii</title>
</head>

<body>
    <header>
        <h3>2do. Parcial</h3>
    </header>
    <main>

        <div id="contenedor"></div>
        <section>
            <article id="articleIzquierdo">
                <div class="divTitulo">
                    <h3 id="titulo">Título</h3>
                </div>
            </article>
            <article id="articleDerecho">
                <div>
                    <label for="" id="">Ingrese un texto</label>
                    <input type="text" name="" id="texto">
                </div>
                <div>
                    <label for="">Seleccione el color de fondo</label>
                    <select name="" id="color">
                        <option value="" disabled selected hidden>Seleccione el color de fondo</option>
                        <option value="red">ROJO</option>
                        <option value="green">VERDE</option>
                        <option value="blue">AZUL</option>
                    </select>
                </div>
                <div>
                    <label for="">Cambie la alineación del texto</label>
                    <div>
                        <label><input type="radio" name="alineacion" id="" value="center"> Centrado</label>
                        <label><input type="radio" name="alineacion" id="" value="left"> Izquierda</label>
                        <label><input type="radio" name="alineacion" id="" value="right"> Derecha</label>
                    </div>
                </div>
            </article>
        </section>
    </main>

    <footer>
        <h3>Esteban BOGADO</h3>
    </footer>

    <script src="index.js"></script>

</body>

</html>
