<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <title>Piedra Papel Tijera</title>
</head>

<body>
    <h1>Piedra Papel Tijera</h1>
    <p>Bienvenido al juego de Piedra, Papel o Tijera. Selecciona tu opción y compite contra la computadora.</p>
    <label for="userChoice">Elija una opción</label>
    <select id="userChoice">
        <option value="piedra">Piedra</option>
        <option value="papel">Papel</option>
        <option value="tijera">Tijera</option>
    </select>
    <button id="playButton" name="jugar">Jugar</button>

    <h2>Resultados</h2>
    <p id="result"></p>

    <script src="script.js"></script>

</body>

</html>
